  <header class="pa-header">
    <img class="pa-logo" src="__LOGO__" alt="PAFF" width="300" height="125">

    <span class="pa-user">Nicolas</span>
  </header>
  <section class="pa-hero" aria-label="Faction sélectionnée">
    <img class="pa-hero-art" alt="">
    <div><p class="pa-eyebrow" data-eyebrow></p><h1 data-name></h1><p class="pa-tagline" data-tagline></p></div>
    <label class="pa-select-label">Faction<select aria-label="Choisir la faction"><option value="sephosi">Sephosi</option><option value="gobelins">Gobelins</option></select></label>
  </section>
  <main class="pa-main">
    <div class="pa-toolbar"><strong data-collection-title>Les unités</strong><span data-collection-caption>Trois profils de votre armée</span></div>
    <div class="pa-deck-total" hidden aria-live="polite"><span data-deck-name></span><strong data-unit-count></strong><span data-points></span></div>
    <div class="pa-collection"></div>
    <footer class="pa-footer"><span data-motto></span><span>PAFF · Collection 2026</span></footer>
  </main>
  <script>
  (() => {
    const root=document.getElementById('__ROOT__');
    const assets=__ASSETS__;
    const data={
      sephosi:{name:'Sephosi',eyebrow:'Discipline · Rigueur · Cohésion',tagline:'Une seule ligne. Une seule volonté.',motto:'La force d’une armée professionnelle.',units:[
        {name:'Lanciers Sephosiens',type:'Troupe',ranged:false,cost:3,r:3,dice:2,offense:3,dc:4,dt:'3+',ability:'Repli stratégique',art:'lanciers-sephosi'},
        {name:'Arbalétriers Sephosiens',type:'Unité de tir',ranged:true,cost:2,r:1,dice:2,offense:3,dc:2,dt:'5+',ability:'',art:'arbaletriers-sephosi'},
        {name:'Cavalerie lourde Sephosienne',type:'Cavalerie',ranged:false,cost:2,r:2,dice:2,offense:3,dc:3,dt:'4+',ability:'Charge puissante',art:'cavalerie-sephosie'}]},
      gobelins:{name:'Gobelins',eyebrow:'Chaos · Instabilité · Déferlement',tagline:'Pas de rangs. Pas de calme. Des gobelins.',motto:'Le chaos n’attend pas les ordres.',units:[
        {name:'Bande de Gobelins',type:'Troupe',ranged:false,cost:1,r:3,dice:3,offense:2,dc:2,dt:'1',ability:'',art:'bande-gobelins'},
        {name:'Archers Gobelins',type:'Unité de tir',ranged:true,cost:1,r:2,dice:3,offense:1,dc:1,dt:'1',ability:'Tir en mêlée',art:'archers-gobelins'},
        {name:'Shamans Gobelins',type:'Unité de tir',ranged:true,cost:1,r:1,dice:1,offense:3,dc:1,dt:'1',ability:'Tir magique',art:'shaman'}]}
    };
    const state={faction:'sephosi',page:'cards',sephosi:[2,1,1],gobelins:[2,1,1]};
    const card=(u,i)=>`<article class="pa-unit" aria-label="${u.name}">
      <div class="pa-card-top"><span class="pa-unit-type"><span class="pa-serial">0${i+1} /</span>${u.type}</span><span class="pa-cost" aria-label="Coût de recrutement : ${u.cost}">${u.cost}</span></div>
      <div class="pa-picture"><img src="${assets[u.art]}" alt="${u.name}" width="640" height="640"><span class="pa-mode"><i data-lucide="${u.ranged?'crosshair':'swords'}" aria-hidden="true"></i>${u.ranged?'Tir':'Corps à corps'}</span></div>
      <div class="pa-card-content"><h2>${u.name}</h2><dl class="pa-stats" aria-label="Profil de l’unité">${[['R',u.r,'Points de Régiment'],['Dés',u.dice,'Nombre de D6'],[u.ranged?'T':'A',u.offense,u.ranged?'Valeur de tir':'Valeur de corps à corps'],['DC',u.dc,'Défense au corps à corps'],['DT',u.dt,'Défense au tir']].map(([label,value,meaning])=>`<div><dt data-tooltip="${meaning}">${label}</dt><dd>${value}</dd></div>`).join('')}</dl>
      <div class="pa-ability">${u.ability?`<button type="button" data-tooltip="Capacité en cours de définition avec le créateur.">${u.ability}</button>`:'<span>—</span>'}</div>
      ${state.page==='deck'?`<div class="pa-quantity"><span>Dans le deck</span><button type="button" data-adjust="${i}" data-delta="-1" aria-label="Retirer ${u.name}">−</button><output>${state[state.faction][i]}</output><button type="button" data-adjust="${i}" data-delta="1" aria-label="Ajouter ${u.name}">+</button></div>`:''}</div></article>`;
    function render(){
      const faction=data[state.faction];root.dataset.faction=state.faction;
      root.querySelector('select').value=state.faction;
      root.querySelector('[data-eyebrow]').textContent=faction.eyebrow;
      root.querySelector('[data-name]').textContent=faction.name;
      root.querySelector('[data-tagline]').textContent=faction.tagline;
      root.querySelector('[data-motto]').textContent=faction.motto;
      root.querySelector('.pa-hero-art').src=assets[faction.units[0].art];
      root.querySelector('[data-collection-title]').textContent=state.page==='deck'?'Mon armée':'Les unités';
      root.querySelector('[data-collection-caption]').textContent=state.page==='deck'?'Composition du deck':'Trois profils de votre armée';
      root.querySelector('.pa-deck-total').hidden=state.page!=='deck';
      root.querySelector('[data-deck-name]').textContent=`Armée ${faction.name}`;
      root.querySelector('[data-unit-count]').textContent=`${state[state.faction].reduce((a,b)=>a+b,0)} unités`;
      root.querySelector('[data-points]').textContent=`${faction.units.reduce((sum,u,i)=>sum+u.cost*state[state.faction][i],0)} points de recrutement`;
      root.querySelectorAll('[data-page]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.page===state.page)));
      root.querySelector('.pa-collection').innerHTML=faction.units.map(card).join('');
      if(globalThis.lucide)lucide.createIcons({attrs:{width:14,height:14}});
    }
    root.querySelector('select').addEventListener('change',event=>{state.faction=event.target.value;render()});
    root.addEventListener('click',event=>{const page=event.target.closest('[data-page]');if(page){state.page=page.dataset.page;render()}
      const adjust=event.target.closest('[data-adjust]');if(adjust){const i=Number(adjust.dataset.adjust);state[state.faction][i]=Math.max(0,state[state.faction][i]+Number(adjust.dataset.delta));render();root.querySelector(`[data-adjust="${i}"][data-delta="${adjust.dataset.delta}"]`).focus()}});
    render();
    if(globalThis.Tweak){const tweaks=new Tweak({container:root,onChange:render});tweaks.addSelect(state,'faction',{label:'Faction',options:[{label:'Sephosi',value:'sephosi'},{label:'Gobelins',value:'gobelins'}]});}
  })();
  </script>
</div>
